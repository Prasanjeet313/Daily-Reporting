<style>
  :root{
    --ink:#141920;
    --ink-soft:#5A6472;
    --paper:#FFFFFF;
    --desk:#5F6873;
    --dvc:#1E3C74;          /* sampled from the DVC mark */
    --dvc-mid:#2E5AA8;
    --dvc-soft:#EDF2FA;
    --dml:#A2560B;
    --dml-mid:#C87A15;
    --dml-soft:#FBF2E5;
    --line:#C7D0DB;
    --hair:#E8ECF2;
    --zebra:#F7F9FC;
    --base:11px;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0;
    background:var(--desk);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  /* ===================== toolbar ===================== */
  .toolbar{
    position:sticky; top:0; z-index:60;
    display:flex; align-items:center; flex-wrap:wrap; gap:9px 14px;
    background:var(--ink); color:#fff;
    padding:9px 18px;
    box-shadow:0 2px 10px rgba(0,0,0,.28);
  }
  .toolbar .tb-mark{
    width:30px; height:30px; border-radius:4px; background:#fff;
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
    padding:2px;
  }
  .toolbar .tb-mark img{ max-width:100%; max-height:100%; display:block; }
  .toolbar .tb-title{ font-size:13.5px; font-weight:700; letter-spacing:.2px; line-height:1.25; }
  .toolbar .tb-title small{
    display:block; font-weight:500; font-size:11px; color:#9BA6B4; letter-spacing:.3px;
  }
  .toolbar .spacer{ margin-left:auto; }
  .toolbar .status{ font-size:11.5px; color:#F2B45C; }
  .tb-btn{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid transparent; border-radius:5px;
    font-family:inherit; font-weight:600; font-size:12.5px;
    padding:8px 13px; cursor:pointer; letter-spacing:.2px;
    transition:filter .15s ease, background .15s ease;
  }
  .tb-btn:hover:not(:disabled){ filter:brightness(1.1); }
  .tb-btn:disabled{ opacity:.5; cursor:progress; }
  .tb-manage{ background:#2B3543; color:#E7ECF3; border-color:#3D4857; }
  .tb-mode{
    display:inline-flex; align-items:center; gap:6px;
    font-size:11.5px; color:#9BA6B4; font-weight:600; letter-spacing:.2px;
  }
  .tb-mode select{
    background:#2B3543; color:#E7ECF3; border:1px solid #3D4857; border-radius:5px;
    font-family:inherit; font-size:12.5px; font-weight:600; padding:7px 8px; cursor:pointer;
  }
  .tb-pdf{ background:#E6EBF2; color:#16202E; }
  .tb-vcf{ background:#1B7F55; color:#fff; }

  /* ===================== editor drawer ===================== */
  .drawer{
    position:fixed; top:0; right:0; bottom:0; z-index:70;
    width:390px; max-width:94vw;
    background:#F4F6F9; color:var(--ink);
    box-shadow:-8px 0 28px rgba(0,0,0,.3);
    display:flex; flex-direction:column;
    transform:translateX(102%);
    transition:transform .22s ease;
  }
  .drawer.open{ transform:none; }
  .drawer-head{
    background:var(--dvc); color:#fff;
    padding:12px 14px;
    display:flex; align-items:center; gap:10px;
  }
  .drawer-head h2{
    margin:0; font-size:15px; font-weight:700; letter-spacing:.3px;
  }
  .drawer-head p{ margin:2px 0 0; font-size:11px; color:#BBD0EA; }
  .drawer-head .x{
    margin-left:auto; background:rgba(255,255,255,.14); color:#fff;
    border:none; border-radius:4px; width:28px; height:28px;
    font-size:16px; line-height:1; cursor:pointer;
  }
  .drawer-tools{
    display:flex; gap:8px; padding:10px 12px; background:#E9EDF3;
    border-bottom:1px solid #D5DCE6;
  }
  .drawer-tools input{
    flex:1 1 auto; min-width:0;
    border:1px solid #C7D0DB; border-radius:5px; padding:7px 9px;
    font-family:inherit; font-size:12.5px; background:#fff;
  }
  .btn-new{
    background:var(--dvc-mid); color:#fff; border:none; border-radius:5px;
    font-family:inherit; font-weight:600; font-size:12.5px; padding:7px 12px; cursor:pointer;
    white-space:nowrap;
  }
  .drawer-body{ flex:1 1 auto; overflow:auto; padding:10px 12px 20px; }

  .ed-section{ margin-bottom:12px; }
  .ed-section-head{
    display:flex; align-items:center; gap:7px;
    padding:5px 8px; border-radius:4px 4px 0 0;
    background:var(--dvc); color:#fff;
    font-size:12px; font-weight:700; letter-spacing:.3px;
  }
  .ed-section.dml .ed-section-head{ background:var(--dml); }
  .ed-section-head .n{
    margin-left:auto; font-family:'IBM Plex Mono',monospace; font-weight:600;
    font-size:10.5px; background:rgba(255,255,255,.2); padding:1px 5px; border-radius:3px;
  }
  .ed-section-head button{
    background:rgba(255,255,255,.18); color:#fff; border:none; border-radius:3px;
    width:22px; height:20px; font-size:12px; line-height:1; cursor:pointer;
  }
  .ed-row{
    display:flex; align-items:center; gap:8px;
    background:#fff; border:1px solid #DCE3EC; border-top:none;
    padding:6px 8px; font-size:12px;
  }
  .ed-row:hover{ background:#FFFDF3; }
  .ed-row .info{ flex:1 1 auto; min-width:0; }
  .ed-row .info b{ display:block; font-weight:600; }
  .ed-row .info span{ display:block; color:var(--ink-soft); font-size:11px; }
  .ed-row .tel{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--dvc-mid);
    white-space:nowrap;
  }
  .ed-row .act{ display:flex; gap:4px; flex:0 0 auto; }
  .ed-row .act button{
    border:1px solid #CBD5E1; background:#F1F5F9; border-radius:4px;
    width:26px; height:24px; cursor:pointer; font-size:12px; line-height:1;
  }
  .ed-row .act .del{ background:#FEF1F1; border-color:#F3C8C8; color:#B42318; }

  .ed-form{
    background:#fff; border:1px solid #C7D0DB; border-radius:6px;
    padding:12px; margin-bottom:14px;
    box-shadow:0 3px 10px rgba(20,30,50,.08);
  }
  .ed-form h3{ margin:0 0 9px; font-size:13px; letter-spacing:.2px; }
  .ed-form label{
    display:block; font-size:11px; font-weight:600; color:var(--ink-soft);
    margin:8px 0 3px; letter-spacing:.2px;
  }
  .ed-form input, .ed-form select{
    width:100%; border:1px solid #C7D0DB; border-radius:5px;
    padding:7px 9px; font-family:inherit; font-size:12.5px; background:#fff;
  }
  .ed-form .two{ display:flex; gap:8px; }
  .ed-form .two > div{ flex:1 1 0; min-width:0; }
  .ed-form .hint{ font-size:10.5px; color:#8A93A0; margin-top:4px; }
  .ed-form .actions{ display:flex; gap:8px; margin-top:12px; }
  .ed-form .actions button{
    border:none; border-radius:5px; padding:8px 13px;
    font-family:inherit; font-weight:600; font-size:12.5px; cursor:pointer;
  }
  .ed-save{ background:var(--dvc); color:#fff; }
  .ed-cancel{ background:#E6EAF0; color:#28313D; }
  .ed-delete{ background:#FDECEC; color:#B42318; margin-left:auto; }
  .ed-empty{ padding:14px; text-align:center; color:#8A93A0; font-size:12px; }

  /* ===================== A4 pages ===================== */
  #directoryRoot{ padding:20px 0 46px; }

  .page{
    width:210mm; height:297mm;
    margin:0 auto 18px;
    padding:8mm 7mm 6mm;
    background:var(--paper);
    box-shadow:0 8px 30px rgba(0,0,0,.3);
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  #directoryRoot.exporting{ padding:0; }
  #directoryRoot.exporting .page{
    box-shadow:none; margin:0 auto;
    height:296.5mm; padding-bottom:5.5mm;   /* a whisker under A4 so nothing spills */
  }
  #directoryRoot.exporting .page:not(:last-child){
    page-break-after:always; break-after:page;
  }

  /* masthead ---------------------------------------------------------- */
  .masthead{
    display:flex; align-items:stretch; gap:11px;
    background:var(--dvc); color:#fff;
    padding:8px 11px;
    border-bottom:3px solid var(--dml-mid);
    flex:0 0 auto;
  }
  .masthead .logo-tile{
    flex:0 0 auto; width:52px;
    background:#fff; border-radius:3px;
    display:flex; align-items:center; justify-content:center;
    padding:4px;
  }
  .masthead .logo-tile img{ width:100%; height:auto; display:block; }
  .masthead .head-text{ min-width:0; display:flex; flex-direction:column; justify-content:center; }
  .masthead h1{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700; font-size:27px; letter-spacing:.8px;
    margin:0; line-height:1;
  }
  .masthead .org{
    margin:3px 0 0; font-size:10.5px; font-weight:600;
    letter-spacing:1.6px; color:#C6D8EE; text-transform:uppercase;
  }
  .masthead .addr{ margin:3px 0 0; font-size:9.5px; color:#A6C0DC; }
  .masthead .stats{
    margin-left:auto; flex:0 0 auto; text-align:right;
    display:flex; flex-direction:column; justify-content:center;
    font-size:9px; color:#A6C0DC; line-height:1.5;
  }
  .masthead .stats b{ color:#fff; font-size:12px; font-weight:700; letter-spacing:.3px; }

  .legend{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    font-size:9px; color:var(--ink-soft); font-weight:500;
    padding:5px 1px 6px; flex:0 0 auto;
  }
  .legend .chip{ display:inline-flex; align-items:center; gap:5px; }
  .legend .chip b{ font-weight:700; color:var(--ink); letter-spacing:.3px; }
  .legend .swatch{ width:9px; height:9px; border-radius:2px; }
  .legend .tip{ margin-left:auto; font-style:italic; color:#8A93A0; }

  /* running header ----------------------------------------------------- */
  .runhead{
    display:flex; align-items:center; gap:9px;
    border-bottom:2px solid var(--dvc);
    padding-bottom:4px; margin-bottom:7px;
    flex:0 0 auto;
  }
  .runhead img{ width:20px; height:auto; display:block; flex:0 0 auto; }
  .runhead .title{
    font-family:'Barlow Condensed',sans-serif; font-weight:700;
    font-size:15px; letter-spacing:.5px; color:var(--dvc);
    text-transform:uppercase;
  }
  .runhead .title em{ font-style:normal; color:var(--ink-soft); font-weight:600; }
  .runhead .sub{ margin-left:auto; font-size:9px; color:#8A93A0; }

  /* columns ------------------------------------------------------------ */
  .page-body{ flex:1 1 auto; min-height:0; display:flex; gap:4.2mm; }
  .col{
    flex:1 1 0; min-width:0;
    display:flex; flex-direction:column; gap:5px;
  }
  .col + .col{ padding-left:4.2mm; border-left:1px solid var(--hair); }

  /* section card -------------------------------------------------------- */
  .section{
    background:#fff;
    border:1px solid var(--line);
    border-radius:3px;
    overflow:hidden;
    break-inside:avoid;
    font-size:var(--base);
  }
  .section.dvc{ border-top:2.5px solid var(--dvc); }
  .section.dml{ border-top:2.5px solid var(--dml); }

  .section h2{
    display:flex; align-items:baseline; gap:5px;
    margin:0; padding:3px 7px;
    font-family:'Barlow Condensed',sans-serif; font-weight:700;
    font-size:1.26em; letter-spacing:.35px; line-height:1.2;
    color:#fff;
  }
  .section.dvc h2{ background:var(--dvc); }
  .section.dml h2{ background:var(--dml); }
  .sec-note{
    font-family:'Inter',sans-serif; font-weight:500;
    font-size:.58em; letter-spacing:.5px; text-transform:uppercase; opacity:.9;
  }
  .sec-note.contd{ font-style:italic; text-transform:none; letter-spacing:.2px; opacity:.75; }
  .sec-org{
    margin-left:auto; flex:0 0 auto;
    font-family:'Inter',sans-serif; font-weight:700;
    font-size:.54em; letter-spacing:1.1px;
    padding:1.5px 5px; border-radius:2px;
    background:rgba(255,255,255,.2);
  }

  .subhead{
    padding:2px 7px;
    border-top:1px solid var(--line);
    font-size:.76em; font-weight:700; letter-spacing:.6px; text-transform:uppercase;
  }
  .section.dvc .subhead{ background:var(--dvc-soft); color:var(--dvc); }
  .section.dml .subhead{ background:var(--dml-soft); color:var(--dml); }

  .entry{
    display:flex; align-items:flex-start; gap:5px;
    padding:2.8px 7px;
    border-top:1px solid var(--hair);
    line-height:1.25;
  }
  .entry.first{ border-top:none; }
  .entry.alt{ background:var(--zebra); }

  .num{
    flex:0 0 auto;
    min-width:1.6em; height:1.6em; padding:0 .28em;
    display:flex; align-items:center; justify-content:center;
    margin-top:.18em;
    border-radius:3px;
    font-family:'IBM Plex Mono',monospace;
    font-size:.72em; font-weight:600; line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .section.dvc .num{ background:var(--dvc-soft); color:var(--dvc); border:1px solid #D4E1F1; }
  .section.dml .num{ background:var(--dml-soft); color:var(--dml); border:1px solid #F0DEC3; }
  .who{ flex:1 1 auto; min-width:6.5em; }
  .name{ display:block; font-weight:600; letter-spacing:-.05px; }
  .role{ display:block; font-size:.82em; line-height:1.18; color:var(--ink-soft); }
  .phone{
    flex:0 0 auto; text-align:right;
    font-family:'IBM Plex Mono',monospace;
    font-size:.92em; font-weight:600;
    font-variant-numeric:tabular-nums;
    color:var(--dvc-mid); white-space:nowrap;
    padding-top:.05em;
  }
  .section.dml .phone{ color:var(--dml); }
  .phone a{ color:inherit; text-decoration:none; }
  .phone a + a{ display:block; margin-top:.5px; }

  /* page footer --------------------------------------------------------- */
  .page-foot{
    flex:0 0 auto;
    display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    margin-top:5px; padding-top:4px;
    border-top:1px solid var(--line);
    font-size:8.4px; color:#7C8593; letter-spacing:.2px;
  }
  .page-foot .pageno{ font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--ink-soft); }

  /* print --------------------------------------------------------------- */
  @page{ size:A4; margin:0; }
  @media print{
    html,body{ background:#fff; }
    .toolbar,.drawer,.no-print{ display:none !important; }
    #directoryRoot{ padding:0; }
    .page{ box-shadow:none; margin:0; }
    .page:not(:last-child){ page-break-after:always; break-after:page; }
    .section,.entry{ break-inside:avoid; }
    *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }

  #measure{
    position:absolute; left:-10000px; top:0;
    visibility:hidden; pointer-events:none;
    display:flex; flex-direction:column; gap:5px;
  }
</style>
</head>

  var OFFICE = {
    org:  'Damodar Valley Corporation',
    unit: 'Tubed Coal Mines, Latehar',
    line: 'Office: Dhobiyajharan, P.O. Murup, Latehar, Jharkhand — PIN 829206',
    street: 'Dhobiyajharan, P.O. Murup',
    city: 'Latehar', state: 'Jharkhand', pin: '829206'
  };

  var BUILD = '2026-09-11';            // bump when the shipped directory data changes
  var STORE_KEY = 'dvc-tubed-directory-' + BUILD;   // so a new build never hides behind old saved edits
  var MAX_PAGES = 3;      // hard ceiling on printed pages
  var COL_CHOICES = [3, 2];  // columns per page - the engine picks what reads best
  var GAP = 5;            // px between stacked section cards
  var SAFETY = 3;         // px of slack kept at the foot of every column
  var MIN_PART = 2;       // never strand fewer than this many rows of a split section
  var BASE_MAX = 19.0, BASE_MIN = 8.0, BASE_STEP = 0.2;

  /* ===================== state ===================== */
  var MODE_KEY = 'dvc-tubed-directory-mode';
  var MODE = (function(){
    try{ return localStorage.getItem(MODE_KEY) || 'large'; } catch(e){ return 'large'; }
  })();                                  // 'large' = biggest type across 3 pages, 'compact' = fewest pages

  var DATA = load();

  function load(){
    try{
      var saved = localStorage.getItem(STORE_KEY);
      if (saved){
        var parsed = JSON.parse(saved);
        if (parsed && parsed.length) return parsed;
      }
    } catch(e){ /* private mode, corrupt value: fall back to the shipped data */ }
    return JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
  function save(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(DATA)); } catch(e){}
  }
  function resetData(){
    if (!confirm('Discard your edits and go back to the validated directory?')) return;
    DATA = JSON.parse(JSON.stringify(DEFAULT_DATA));
    try{ localStorage.removeItem(STORE_KEY); } catch(e){}
    refresh('Reset to the validated directory');
  }

  /* ===================== helpers ===================== */
  function esc(t){
    return String(t == null ? '' : t)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function digits(s){ return String(s == null ? '' : s).replace(/[^0-9]/g, ''); }
  function fmtPhone(p){ return p.length === 10 ? p.slice(0,5) + ' ' + p.slice(5) : p; }
  function countEntries(sec){ return sec.entries.filter(function(e){ return !e.sub; }).length; }
  function el(tag, cls, html){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }
  function totalContacts(){
    return DATA.reduce(function(a, s){ return a + countEntries(s); }, 0);
  }

  /* ===================== section cards ===================== */
  function cardShell(sec, contd){
    var wrap = el('div', 'section ' + sec.org.toLowerCase());
    wrap.dataset.org = sec.org;
    wrap.appendChild(el('h2', null,
      '<span class="sec-title">' + esc(sec.title) + '</span>' +
      (sec.note ? '<span class="sec-note">' + esc(sec.note) + '</span>' : '') +
      (contd ? '<span class="sec-note contd">cont.</span>' : '') +
      '<span class="sec-org">' + esc(sec.org) + '</span>'));
    return wrap;
  }
  function itemNode(item){
    if (item.sub) return el('div', 'subhead', esc(item.sub));
    var e = item.entry;
    var phones = (e.phones || []).map(function(p){
      return '<a href="tel:+91' + esc(p) + '">' + esc(fmtPhone(p)) + '</a>';
    }).join('');
    return el('div', 'entry',
      '<span class="num">' + item.no + '</span>' +
      '<span class="who"><span class="name">' + esc(e.name) + '</span>' +
        (e.role ? '<span class="role">' + esc(e.role) + '</span>' : '') + '</span>' +
      '<span class="phone">' + phones + '</span>');
  }

  var ITEMS = [];
  function flatten(){
    ITEMS = [];
    DATA.forEach(function(sec, si){
      var no = 0, ki = 0;
      sec.entries.forEach(function(e){
        if (e.sub) ITEMS.push({ sec: si, ki: ki++, sub: e.sub });
        else { no++; ITEMS.push({ sec: si, ki: ki++, entry: e, no: no }); }
      });
    });
  }

  /* ===================== page furniture ===================== */
  function mastheadNode(){
    return el('div', 'masthead',
      '<div class="logo-tile"><img src="' + LOGO + '" alt="Damodar Valley Corporation"></div>' +
      '<div class="head-text">' +
        '<h1>TELEPHONE DIRECTORY</h1>' +
        '<p class="org">' + esc(OFFICE.org) + ' &nbsp;·&nbsp; ' + esc(OFFICE.unit) + '</p>' +
        '<p class="addr">' + esc(OFFICE.line) + '</p>' +
      '</div>');
  }
  function runheadNode(){
    return el('div', 'runhead',
      '<img src="' + LOGO + '" alt="">' +
      '<span class="title">Telephone Directory <em>· ' + esc(OFFICE.unit) + '</em></span>' +
      '<span class="sub">' + esc(OFFICE.org) + '</span>');
  }
  function footNode(){
    return el('div', 'page-foot',
      '<span>' + esc(OFFICE.org) + ' · ' + esc(OFFICE.unit) + ' · ' + esc(OFFICE.street) +
      ', ' + esc(OFFICE.city) + ' - ' + esc(OFFICE.pin) + '</span>' +
      '<span class="pageno"></span>');
  }
  function pageNode(index, cols){
    cols = cols || 3;
    var page = el('div', 'page');
    page.appendChild(index === 0 ? mastheadNode() : runheadNode());
    if (index === 0){
      page.appendChild(el('div', 'legend',
        '<span class="chip"><span class="swatch" style="background:var(--dvc)"></span>' +
          '<b>DVC</b> — Damodar Valley Corporation</span>' +
        '<span class="chip"><span class="swatch" style="background:var(--dml)"></span>' +
          '<b>DML</b> — Develecto Mining Limited, Mine Developer &amp; Operator (MDO)</span>' +
        '<span class="tip"></span>'));
    }
    var body = el('div', 'page-body');
    for (var c = 0; c < cols; c++) body.appendChild(el('div', 'col'));
    page.appendChild(body);
    page.appendChild(footNode());
    return page;
  }

  /* ===================== measurement =====================
     Every candidate type size is laid out for real and measured. A size is
     rejected if any row is too wide for its column, which is what keeps the
     phone numbers whole however large the type gets.                      */
  function measureAt(base, cols){
    var root = document.getElementById('directoryRoot');
    document.documentElement.style.setProperty('--base', base + 'px');

    root.innerHTML = '';
    var probe = pageNode(0, cols);
    root.appendChild(probe);
    var colW = probe.querySelector('.col').getBoundingClientRect().width;
    var colH = probe.querySelector('.page-body').getBoundingClientRect().height;
    var probe2 = pageNode(1, cols);
    root.appendChild(probe2);
    var colH2 = probe2.querySelector('.page-body').getBoundingClientRect().height;
    root.innerHTML = '';

    var measure = document.getElementById('measure');
    measure.innerHTML = '';
    measure.style.width = colW + 'px';

    var cards = DATA.map(function(sec, si){
      var card = cardShell(sec, false);
      ITEMS.forEach(function(it){ if (it.sec === si) card.appendChild(itemNode(it)); });
      measure.appendChild(card);
      return card;
    });

    var tooWide = false, names = 0, wrapped = 0, lineH = 0;
    cards.forEach(function(card){
      card.querySelectorAll('.entry').forEach(function(row){
        if (row.scrollWidth > row.clientWidth + 0.5) tooWide = true;
      });
      card.querySelectorAll('.name').forEach(function(n){
        if (!lineH) lineH = parseFloat(getComputedStyle(n).lineHeight) || (base * 1.25);
        names++;
        if (n.getBoundingClientRect().height > lineH * 1.5) wrapped++;
      });
    });

    var metrics = cards.map(function(card){
      var head = card.querySelector('h2').getBoundingClientRect().height;
      var kids = Array.prototype.slice.call(card.children, 1)
                      .map(function(k){ return k.getBoundingClientRect().height; });
      var sum = kids.reduce(function(a, b){ return a + b; }, 0);
      return { head: head, kids: kids, chrome: card.getBoundingClientRect().height - head - sum };
    });

    measure.innerHTML = '';
    return { colH: colH, colH2: colH2, metrics: metrics, ok: !tooWide,
             wrap: names ? wrapped / names : 0 };
  }

  /* ===================== column flow =====================
     Rows pour down the columns; a section crossing a boundary is re-titled
     "cont." at the top of the next column. Split points are chosen to keep
     every column near the average height, so columns fill evenly.        */
  function fragHeight(metrics, from, to){
    var h = 0, cur = -1;
    for (var k = from; k < to; k++){
      var it = ITEMS[k];
      if (it.sec !== cur){
        cur = it.sec;
        h += (h > 0 ? GAP : 0) + metrics[cur].chrome + metrics[cur].head;
      }
      h += metrics[cur].kids[it.ki];
    }
    return h;
  }
  function splitOk(x){
    if (x <= 0 || x >= ITEMS.length) return true;
    var a = ITEMS[x - 1], b = ITEMS[x];
    if (a.sec !== b.sec) return true;
    var total = DATA[a.sec].entries.length;
    return (a.ki + 1) >= MIN_PART && (total - b.ki) >= MIN_PART;
  }
  function flow(metrics, n, caps){
    var m = ITEMS.length;
    if (!m) return [];
    var total = fragHeight(metrics, 0, m);
    var capSum = caps.reduce(function(a, b){ return a + b; }, 0);
    var target = caps.map(function(c){ return total * c / capSum; });   // fill every column to the same depth
    var INF = Infinity, dp = [], cut = [], k, i, j;

    for (k = 0; k <= n; k++){
      dp.push(new Array(m + 1).fill(INF));
      cut.push(new Array(m + 1).fill(-1));
    }
    dp[0][0] = 0;

    for (k = 1; k <= n; k++){
      for (i = 0; i <= m; i++){
        if (!splitOk(i)) continue;
        for (j = i; j >= 0; j--){
          if (!splitOk(j)) continue;
          var h = fragHeight(metrics, j, i);
          if (h > caps[k - 1]) break;
          if (dp[k - 1][j] === INF) continue;
          var d = h - target[k - 1], cost = dp[k - 1][j] + d * d;
          if (cost < dp[k][i]){ dp[k][i] = cost; cut[k][i] = j; }
        }
      }
    }
    if (dp[n][m] === INF) return null;

    var cols = [], end = m;
    for (k = n; k >= 1; k--){
      var start = cut[k][end];
      cols.unshift([start, end]);
      end = start;
    }
    return cols;
  }

  function planAt(base, pages, ncols){
    var m = measureAt(base, ncols);
    if (!m.ok) return null;                      // a number would be squeezed
    var caps = [];
    for (var c = 0; c < pages * ncols; c++){
      caps.push((c < ncols ? m.colH : m.colH2) - SAFETY);   // page 1 is shorter: it carries the masthead
    }
    var cols = flow(m.metrics, pages * ncols, caps);
    return cols ? { cols: cols, pages: pages, base: base, ncols: ncols, wrap: m.wrap } : null;
  }

  /* fewest pages first, then the largest type that still fits */
  function build(){
    flatten();
    var steps = [], b;
    for (b = BASE_MAX; b >= BASE_MIN - 1e-9; b = Math.round((b - BASE_STEP) * 100) / 100) steps.push(b);

    var firstPage = (MODE === 'large') ? MAX_PAGES : 1;
    for (var pages = firstPage; pages <= MAX_PAGES; pages++){
      var best = null;
      COL_CHOICES.forEach(function(ncols){
        var lo = 0, hi = steps.length - 1, found = null;
        while (lo <= hi){                          // steps run largest-first
          var mid = (lo + hi) >> 1;
          var plan = planAt(steps[mid], pages, ncols);
          if (plan){ found = plan; hi = mid - 1; } // fits: try bigger type
          else { lo = mid + 1; }
        }
        if (!found) return;
        if (!best){ best = found; return; }
        var gain = found.base - best.base;
        if (gain > 1) best = found;                        // clearly bigger type wins
        else if (gain > -1 && found.wrap < best.wrap - 0.02) best = found;  // same-ish size, fewer names pushed onto a second line
      });
      if (best){ paint(best); return best; }
    }
    var last = planAt(BASE_MIN, MAX_PAGES, 3) ||
               { cols: [[0, ITEMS.length]], pages: 1, base: BASE_MIN, ncols: 3 };
    paint(last);
    return last;
  }

  function paint(plan){
    var root = document.getElementById('directoryRoot');
    document.documentElement.style.setProperty('--base', plan.base + 'px');
    root.innerHTML = '';
    for (var p = 0; p < plan.pages; p++) root.appendChild(pageNode(p, plan.ncols));

    var cols = root.querySelectorAll('.col');
    plan.cols.forEach(function(range, ci){
      var col = cols[ci], card = null, cur = -1;
      for (var k = range[0]; k < range[1]; k++){
        var it = ITEMS[k];
        if (it.sec !== cur){
          cur = it.sec;
          card = cardShell(DATA[cur], it.ki > 0);
          col.appendChild(card);
        }
        card.appendChild(itemNode(it));
      }
    });

    root.querySelectorAll('.section').forEach(function(sec){
      var first = sec.children[1];
      if (first) first.classList.add('first');
      var n = 0;
      Array.prototype.slice.call(sec.children, 1).forEach(function(row){
        if (!row.classList.contains('entry')) return;
        if (n % 2) row.classList.add('alt');
        n++;
      });
    });
    root.querySelectorAll('.page-foot .pageno').forEach(function(n, i){
      n.textContent = 'Page ' + (i + 1) + ' of ' + plan.pages;
    });
  }

  function setMode(m){
    MODE = m;
    try{ localStorage.setItem(MODE_KEY, m); } catch(e){}
    var plan = build();
    flash((m === 'large' ? 'Large print' : 'Compact') + ' · ' + plan.pages +
          ' pages · ' + plan.ncols + ' columns · ' + plan.base + 'px type');
  }

  function refresh(msg){
    save();
    var plan = build();
    renderEditor();
    flash((msg ? msg + ' · ' : '') + totalContacts() + ' contacts · ' +
          plan.pages + ' page' + (plan.pages > 1 ? 's' : '') + ' · ' +
          plan.ncols + ' columns · ' + plan.base + 'px type');
    return plan;
  }

  /* ===================== editor ===================== */
  var editing = null;      // {si, ei} or {si:null} for a new contact

  function openEditor(){ document.getElementById('drawer').classList.add('open'); renderEditor(); }
  function closeEditor(){ document.getElementById('drawer').classList.remove('open'); editing = null; renderEditor(); }

  function newContact(){ editing = { si: null, ei: null }; renderEditor(); }
  function editContact(si, ei){ editing = { si: si, ei: ei }; renderEditor(); openEditor(); }

  function deleteContact(si, ei){
    var e = DATA[si].entries[ei];
    if (!confirm('Remove ' + e.name + ' from the directory?')) return;
    DATA[si].entries.splice(ei, 1);
    if (!countEntries(DATA[si])) DATA.splice(si, 1);   // section emptied out
    editing = null;
    refresh('Removed ' + e.name);
  }
  function deleteSection(si){
    var sec = DATA[si];
    if (!confirm('Remove the whole "' + sec.title + '" section (' + countEntries(sec) + ' contacts)?')) return;
    DATA.splice(si, 1);
    editing = null;
    refresh('Removed section ' + sec.title);
  }

  function saveContact(){
    var name = document.getElementById('fName').value.trim();
    if (!name){ alert('Please enter a name.'); return; }
    var title = document.getElementById('fSection').value.trim();
    if (!title){ alert('Please choose or type a section.'); return; }
    var org = document.getElementById('fOrg').value;
    var role = document.getElementById('fRole').value.trim();
    var phones = document.getElementById('fPhones').value.split(/[,;/\n]+/)
                   .map(digits).filter(function(p){ return p.length >= 5; });
    var seen = {};
    phones = phones.filter(function(p){ if (seen[p]) return false; seen[p] = 1; return true; });

    var entry = { name: name, role: role, phones: phones };

    // find (or create) the destination section
    var target = -1;
    DATA.forEach(function(s, i){
      if (target < 0 && s.title.toLowerCase() === title.toLowerCase() && s.org === org) target = i;
    });
    if (target < 0){
      var at = DATA.length;
      for (var i = DATA.length - 1; i >= 0; i--) if (DATA[i].org === org){ at = i + 1; break; }
      DATA.splice(at, 0, { org: org, title: title, note: '', entries: [] });
      target = at;
      if (editing && editing.si != null && editing.si >= at) editing.si++;
    }

    if (editing && editing.si != null){                 // editing an existing row
      var from = DATA[editing.si];
      var old = from.entries[editing.ei];
      if (from === DATA[target]){
        from.entries[editing.ei] = entry;
      } else {
        from.entries.splice(editing.ei, 1);
        DATA[target].entries.push(entry);
        if (!countEntries(from)){
          var fi = DATA.indexOf(from);
          DATA.splice(fi, 1);
        }
      }
      editing = null;
      refresh('Updated ' + (old ? old.name : name));
    } else {
      DATA[target].entries.push(entry);
      editing = null;
      refresh('Added ' + name);
    }
  }

  function formHtml(){
    var e = { name: '', role: '', phones: [] }, secTitle = '', org = 'DVC', isEdit = false;
    if (editing && editing.si != null){
      e = DATA[editing.si].entries[editing.ei];
      secTitle = DATA[editing.si].title;
      org = DATA[editing.si].org;
      isEdit = true;
    }
    var opts = DATA.map(function(s){ return '<option value="' + esc(s.title) + '"></option>'; }).join('');
    return '<div class="ed-form">' +
      '<h3>' + (isEdit ? 'Edit contact' : 'New contact') + '</h3>' +
      '<div class="two">' +
        '<div><label for="fSection">Section</label>' +
          '<input id="fSection" list="secList" value="' + esc(secTitle) + '" placeholder="e.g. Overman">' +
          '<datalist id="secList">' + opts + '</datalist></div>' +
        '<div><label for="fOrg">Company</label>' +
          '<select id="fOrg">' +
            '<option value="DVC"' + (org === 'DVC' ? ' selected' : '') + '>DVC — lease holder</option>' +
            '<option value="DML"' + (org === 'DML' ? ' selected' : '') + '>DML — MDO</option>' +
          '</select></div>' +
      '</div>' +
      '<label for="fName">Name</label>' +
      '<input id="fName" value="' + esc(e.name) + '" placeholder="Full name">' +
      '<label for="fRole">Designation</label>' +
      '<input id="fRole" value="' + esc(e.role || '') + '" placeholder="e.g. Overman">' +
      '<label for="fPhones">Mobile number(s)</label>' +
      '<input id="fPhones" value="' + esc((e.phones || []).join(', ')) + '" placeholder="9876543210, 9123456780">' +
      '<div class="hint">Separate multiple numbers with a comma. A new section name creates that section.</div>' +
      '<div class="actions">' +
        '<button class="ed-save" onclick="saveContact()">Save</button>' +
        '<button class="ed-cancel" onclick="cancelEdit()">Cancel</button>' +
        (isEdit ? '<button class="ed-delete" onclick="deleteContact(' + editing.si + ',' + editing.ei + ')">Delete</button>' : '') +
      '</div></div>';
  }
  function cancelEdit(){ editing = null; renderEditor(); }

  function renderEditor(){
    var body = document.getElementById('edBody');
    if (!body) return;
    var q = (document.getElementById('edSearch').value || '').trim().toLowerCase();
    var html = editing ? formHtml() : '';
    var shown = 0;

    DATA.forEach(function(sec, si){
      var rows = '';
      sec.entries.forEach(function(e, ei){
        if (e.sub) return;
        var hay = (e.name + ' ' + (e.role || '') + ' ' + (e.phones || []).join(' ')).toLowerCase();
        if (q && hay.indexOf(q) < 0) return;
        shown++;
        rows += '<div class="ed-row">' +
          '<span class="info"><b>' + esc(e.name) + '</b>' +
            (e.role ? '<span>' + esc(e.role) + '</span>' : '') + '</span>' +
          '<span class="tel">' + (e.phones || []).map(fmtPhone).map(esc).join('<br>') + '</span>' +
          '<span class="act">' +
            '<button title="Edit" onclick="editContact(' + si + ',' + ei + ')">✎</button>' +
            '<button class="del" title="Remove" onclick="deleteContact(' + si + ',' + ei + ')">✕</button>' +
          '</span></div>';
      });
      if (!rows) return;
      html += '<div class="ed-section ' + sec.org.toLowerCase() + '">' +
        '<div class="ed-section-head">' + esc(sec.title) +
          (sec.note ? ' · ' + esc(sec.note) : '') +
          '<span class="n">' + sec.org + ' ' + countEntries(sec) + '</span>' +
          '<button title="Add to this section" onclick="addToSection(' + si + ')">+</button>' +
          '<button title="Remove this section" onclick="deleteSection(' + si + ')">🗑</button>' +
        '</div>' + rows + '</div>';
    });

    if (!shown) html += '<div class="ed-empty">No contact matches “' + esc(q) + '”.</div>';
    body.innerHTML = html;
    document.getElementById('edCount').textContent =
      totalContacts() + ' contacts · ' + DATA.length + ' sections';
  }

  function addToSection(si){
    editing = { si: null, ei: null, presetSection: DATA[si].title, presetOrg: DATA[si].org };
    renderEditor();
    var f = document.getElementById('fSection');
    if (f){ f.value = DATA[si].title; document.getElementById('fOrg').value = DATA[si].org; }
    document.getElementById('fName').focus();
  }

  /* ===================== contacts read-out ===================== */
  function collectContacts(){
    var list = [];
    DATA.forEach(function(sec){
      var group = '';
      sec.entries.forEach(function(e){
        if (e.sub){ group = e.sub; return; }
        var phones = (e.phones || []).map(digits).filter(Boolean);
        var seen = {};
        phones = phones.filter(function(p){ if (seen[p]) return false; seen[p] = 1; return true; });
        list.push({
          name: (e.name || '').trim(),
          role: (e.role || '').trim(),
          org: sec.org,
          section: sec.title + (sec.note ? ' (' + sec.note + ')' : '') + (group ? ' — ' + group : ''),
          phones: phones
        });
      });
    });
    return list;
  }

  /* Merge genuine duplicates: the same person listed twice. Two rows merge
     only when the name and the company match AND their numbers overlap,
     so two different people sharing a name stay separate.                */
  function dedupe(list){
    var out = [];
    list.forEach(function(c){
      if (!c.name) return;
      var key = c.name.toLowerCase().replace(/[^a-z0-9]/g, '');
      var hit = null;
      out.forEach(function(o){
        if (hit) return;
        if (o.key !== key || o.org !== c.org) return;
        var overlap = c.phones.some(function(p){ return o.phones.indexOf(p) >= 0; });
        if (overlap || !c.phones.length || !o.phones.length) hit = o;
      });
      if (hit){
        c.phones.forEach(function(p){ if (hit.phones.indexOf(p) < 0) hit.phones.push(p); });
        if (!hit.role && c.role) hit.role = c.role;
        if (hit.section.indexOf(c.section) < 0) hit.section += ' / ' + c.section;
        return;
      }
      out.push({ key: key, name: c.name, role: c.role, org: c.org,
                 section: c.section, phones: c.phones.slice() });
    });
    return out;
  }

  /* ===================== vCard ===================== */
  function vEsc(v){
    return String(v).replace(/\\/g, '\\\\').replace(/;/g, '\\;')
                    .replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  }
  function buildVcf(list){
    var out = [];
    list.forEach(function(c){
      var fn = [c.name, c.role, c.org].filter(Boolean).join(' ');
      out.push('BEGIN:VCARD');
      out.push('VERSION:3.0');
      out.push('N:' + vEsc(fn) + ';;;;');
      out.push('FN:' + vEsc(fn));
      out.push('ORG:' + vEsc(c.org === 'DVC' ? OFFICE.org : 'Develecto Mining Limited (MDO)') +
               ';' + vEsc(OFFICE.unit) + ';' + vEsc(c.section));
      if (c.role) out.push('TITLE:' + vEsc(c.role));
      c.phones.forEach(function(p){
        out.push('TEL;TYPE=CELL,VOICE:' + (p.length === 10 ? '+91' : '') + p);
      });
      out.push('ADR;TYPE=WORK:;;' + vEsc(OFFICE.street) + ';' + vEsc(OFFICE.city) +
               ';' + vEsc(OFFICE.state) + ';' + vEsc(OFFICE.pin) + ';India');
      out.push('NOTE:' + vEsc(c.section + ' · ' + c.org + ' · ' + OFFICE.unit));
      out.push('END:VCARD');
    });
    return out.join('\r\n') + '\r\n';
  }

  function saveBlob(filename, text, mime){
    var blob = new Blob([text], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }
  function flash(msg){
    var s = document.getElementById('status');
    if (!s) return;
    s.textContent = msg;
    if (msg) setTimeout(function(){ if (s.textContent === msg) s.textContent = ''; }, 5000);
  }

  function downloadVcf(){
    var list = dedupe(collectContacts());
    if (!list.length){ flash('Nothing to export yet.'); return; }
    saveBlob('DVC_Tubed_Coal_Mines_Contacts.vcf', buildVcf(list), 'text/vcard;charset=utf-8');
    flash('Saved ' + list.length + ' contacts as .vcf');
  }

  async function downloadPdf(){
    var btn = document.getElementById('pdfBtn');
    var label = btn.textContent;
    var root = document.getElementById('directoryRoot');
    btn.disabled = true;
    btn.textContent = 'Preparing PDF…';
    root.classList.add('exporting');
    try{
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      var opt = {
        margin: 0,
        filename: 'DVC_Tubed_Coal_Mines_Telephone_Directory.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak: { mode: ['css', 'legacy'] }
      };
      if (window.html2pdf){
        await window.html2pdf().set(opt).from(root).save();
        flash('PDF downloaded');
      } else {
        window.print();
      }
    } catch (err){
      console.error(err);
      window.print();
    } finally {
      root.classList.remove('exporting');
      btn.disabled = false;
      btn.textContent = label;
    }
  }

  /* ===================== boot ===================== */
  function boot(){
    var sel = document.getElementById('layoutMode');
    if (sel) sel.value = MODE;
    var plan = build();
    renderEditor();
    flash(totalContacts() + ' contacts · ' + plan.pages + ' pages · ' +
          plan.ncols + ' columns · ' + plan.base + 'px type');
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot);
  else window.addEventListener('load', boot);
</script>
